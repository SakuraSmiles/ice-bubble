  #     context: /mnt/d/workspace/open-design
  #     dockerfile: /mnt/d/workspace/ice-bubble/docker/dockerfiles/ice-bubble-opendesign/Dockerfile
  #   container_name: ice-bubble-opendesign
  #   restart: unless-stopped
  #   working_dir: /app
  #   ports:
  #     - "7457:7457"
  #   environment:
  #     - HOME=/home/dabai
  #     - OD_PORT=7457
  #   user: "${UID}:${GID}"
  #   networks:
  #     - ice-bubble-net
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "const net=require('net');const s=net.createConnection({port:7457,host:'127.0.0.1'},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 15s

networks:
  ice-bubble-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
